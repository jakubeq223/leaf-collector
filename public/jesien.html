function textWidth(text, sc) { return text.length * 6 * sc; }
function drawText(text, x, y, color, sc) {
  sc = sc || 1;
  ctx.fillStyle = color;
  let cx = x | 0;
  const cy = y | 0;
  for (const ch of text) {
    const glyph = F[ch] || (ch === " " ? F[" "] : F["?"]);
    if (glyph && ch !== " ") {
      for (let r = 0; r < glyph.length; r++) {
        const row = glyph[r];
        for (let c = 0; c < row.length; c++) {
          if (row[c] === "1") ctx.fillRect(cx + c * sc, cy + r * sc, sc, sc);
        }
      }
    }
    cx += 6 * sc;
  }
}
function drawTextShadow(text, x, y, color, sc) {
  drawText(text, x + sc, y + sc, "#1a120c", sc);
  drawText(text, x, y, color, sc);
}
function drawTextCentered(text, cx, y, color, sc) {
  drawTextShadow(text, cx - textWidth(text, sc) / 2, y, color, sc);
}
function wrapText(text, maxPx, sc) {
  const maxChars = Math.max(6, Math.floor(maxPx / (6 * sc)));
  const words = text.split(" ");
  const lines = [];
  let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (t.length > maxChars && cur) { lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ---------- audio ---------- */
let actx = null, master = null, musicGain = null, sfxGain = null;
let musicOn = false, step = 0, nextT = 0, noiseBuf = null;

function unlock() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain();
      musicGain = actx.createGain();
      sfxGain = actx.createGain();
      musicGain.gain.value = 0.32;
      sfxGain.gain.value = 0.55;
      musicGain.connect(master);
      sfxGain.connect(master);
      master.connect(actx.destination);
      master.gain.value = muted ? 0 : 1;
      const len = (actx.sampleRate * 0.25) | 0;
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === "suspended") actx.resume();
  } catch (e) { fail(e.message || e); }
}
function applyMute() {
  muted = !muted;
  dirty = true;
  if (master && actx) master.gain.setTargetAtTime(muted ? 0 : 1, actx.currentTime, 0.03);
}
function midi(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function envGain(t, dur, peak, dest) {
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + Math.min(0.02, dur * 0.3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g.connect(dest);
  return g;
}
function tone(type, freq, t, dur, peak, dest) {
  const o = actx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(20, freq), t);
  const g = envGain(t, dur, peak, dest);
  o.connect(g);
  o.start(t);
  o.stop(t + dur + 0.02);
}
function noiseHit(t, dur, freq, q, peak, dest) {
  const src = actx.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;
  const f = actx.createBiquadFilter();
  f.type = "bandpass";
  f.frequency.value = freq;
  f.Q.value = q;
  const g = envGain(t, dur, peak, dest);
  src.connect(f); f.connect(g);
  src.start(t); src.stop(t + dur + 0.02);
}
function startMusic() {
  unlock();
  if (!actx || musicOn) return;
  musicOn = true;
  step = 0;
  nextT = actx.currentTime + 0.05;
}
function setStation(i) {
  station = ((i % 3) + 3) % 3;
  step = 0;
  stationToast = 1.5;
  dirty = true;
  if (actx) nextT = actx.currentTime + 0.05;
}
function schedChiptune(s, t) {
  const mel = [76,72,69,72, 76,67,69,72, 74,72,69,67, 69,64,62,64, 76,79,76,72, 74,72,69,67, 69,72,74,76, 72,69,67,64];
  const n = mel[s % 32];
  const dur = 0.14;
  if (n) tone("triangle", midi(n), t, dur, 0.07, musicGain);
  if (s % 4 === 0) {
    const bass = [45, 45, 41, 43][(s >> 3) % 4];
    tone("square", midi(bass), t, 0.28, 0.045, musicGain);
  }
  if (s % 2 === 1) noiseHit(t, 0.03, 6000, 0.6, 0.015, musicGain);
}
function schedLofi(s, t) {
  const chords = [
    [50, 53, 57, 60],
    [55, 59, 62, 65],
    [48, 52, 55, 59],
    [45, 48, 52, 55],
  ];
  if (s % 8 === 0) {
    const ch = chords[(s >> 3) % 4];
    for (const m of ch) {
      tone("sine", midi(m), t, 1.5, 0.035, musicGain);
      tone("sine", midi(m) * 1.005, t, 1.45, 0.02, musicGain);
    }
    tone("sine", midi(ch[0] - 12), t, 0.7, 0.06, musicGain);
  }
  if (s % 8 === 4) {
    const ch = chords[(s >> 3) % 4];
    tone("sine", midi(ch[0] - 12), t, 0.4, 0.04, musicGain);
  }
  if (s % 2 === 0) noiseHit(t, 0.04, 7000, 0.5, 0.012, musicGain);
}
function kick(t, vol) {
  const o = actx.createOscillator();
  o.type = "sine";
  o.frequency.setValueAtTime(156, t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.12);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + 0.18);
}
function snare(t, vol) {
  tone("triangle", 196, t, 0.08, vol * 0.4, musicGain);
  noiseHit(t, 0.12, 1800, 0.7, vol, musicGain);
}
function hat(t, open) {
  noiseHit(t, open ? 0.07 : 0.02, 8000, 0.8, open ? 0.04 : 0.025, musicGain);
}
function reese(t, freq, dur) {
  const filter = actx.createBiquadFilter();
  filter.type = "lowpass";
  filter.Q.value = 7;
  filter.frequency.setValueAtTime(160, t);
  filter.frequency.linearRampToValueAtTime(640, t + dur * 0.45);
  filter.frequency.linearRampToValueAtTime(140, t + dur);
  filter.connect(musicGain);
  for (const det of [-8, 9]) {
    const o = actx.createOscillator();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(freq * Math.pow(2, det / 1200), t);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.04);
    g.gain.setValueAtTime(0.07, t + dur - 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(filter);
    o.start(t); o.stop(t + dur + 0.02);
  }
}
function schedDnb(s, t) {
  const i = s % 32;
  const kicks = { 0: 1, 10: 1, 16: 1, 22: 0.7, 26: 0.85 };
  const snares = { 4: 1, 12: 1, 20: 1, 28: 1 };
  const ghosts = { 7: 0.28, 14: 0.22, 23: 0.25, 30: 0.2 };
  if (kicks[i]) kick(t, 0.5 * kicks[i]);
  if (snares[i]) snare(t, 0.28);
  else if (ghosts[i]) snare(t, ghosts[i] * 0.25);
  hat(t, i % 4 === 2);
  if (i === 0) {
    const roots = [33, 33, 29, 31, 28, 33, 36, 31];
    const bar = Math.floor(s / 16) % roots.length;
    reese(t, midi(roots[bar]), 16 * (60 / 170 / 4) * 0.98);
  }
}
function updateMusic() {
  if (!musicOn || !actx) return;
  try {
    const stepDur = station === 0 ? 0.15 : station === 1 ? 60 / 72 / 2 : 60 / 170 / 4;
    const horizon = actx.currentTime + 0.22;
    let guard = 0;
    while (nextT < horizon && guard < 24) {
      if (station === 0) schedChiptune(step, nextT);
      else if (station === 1) schedLofi(step, nextT);
      else schedDnb(step, nextT);
      step++;
      nextT += stepDur;
      guard++;
    }
    if (station === 1 && Math.random() < 0.12) {
      noiseHit(actx.currentTime, 0.015, 1200 + Math.random() * 4000, 0.4, 0.02, musicGain);
    }
  } catch (e) { /* audio must never kill the frame */ }
}
function sfxCrunch(big) {
  if (!actx || sndGap > 0) return;
  sndGap = 0.045;
  noiseHit(actx.currentTime, big ? 0.09 : 0.055, 900 + Math.random() * 1400, 0.8, big ? 0.16 : 0.1, sfxGain);
}
function sfxUnique(kind) {
  if (!actx) return;
  const t = actx.currentTime;
  const filter = actx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = kind === 3 ? 420 : 900;
  filter.connect(sfxGain);
  const notes = kind === 1 ? [523, 659] : kind === 2 ? [523, 659, 784] : [110, 164, 220];
  notes.forEach((f, i) => tone("sine", f, t + i * 0.05, 0.18, 0.03, filter));
}
function sfxCoins() {
  if (!actx) return;
  const t = actx.currentTime;
  [880, 1174, 1568, 2093].forEach((f, i) => tone("square", f, t + i * 0.055, 0.1, 0.05, sfxGain));
}
function sfxBlip() {
  if (!actx) return;
  tone("square", 660, actx.currentTime, 0.06, 0.04, sfxGain);
}
function sfxGlass() {
  if (!actx) return;
  const t = actx.currentTime;
  noiseHit(t, 0.35, 2400, 0.5, 0.28, sfxGain);
  noiseHit(t, 0.18, 800, 0.4, 0.2, sfxGain);
  for (let i = 0; i < 6; i++) {
    tone("square", 1600 - i * 180 + Math.random() * 80, t + i * 0.03, 0.08, 0.04, sfxGain);
  }
}
function phoneBuzz() {
  if (!actx) return;
  const t0 = actx.currentTime;
  for (let p = 0; p < 2; p++) {
    const t = t0 + p * 0.28;
    const o = actx.createOscillator();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(62, t);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    const f = actx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = 240;
    o.connect(f); f.connect(g); g.connect(sfxGain);
    o.start(t); o.stop(t + 0.2);
  }
}

const SHAPES = [
  ["..OFO..", ".OFFFO.", "OFFSSFO", ".OFFFO.", "..OTO..", "...T..."],
  [".O.O.O.", "OFFOFFO", "FFSSSSF", "OFFSSFO", ".OFSTO.", "..OOO.."],
  ["...O...", "..OFO..", ".OFFFO.", "OFFSSFO", ".OFSTO.", "..OTO..", "...O..."],
];
const PAL = [
  ["#e25822", "#a33a14", "#3d160c", "#6b3a1e"],
  ["#f0a020", "#c47a10", "#4a3008", "#6b4a16"],
  ["#c4332a", "#8e2018", "#3a0c0a", "#5c2a18"],
  ["#d86a2c", "#a84818", "#3a1808", "#6a3a18"],
  ["#e8c56a", "#c49a3a", "#4a3810", "#7a5a28"],
];
function paintShape(g, shape, fill, shade, outline, stem) {
  const rows = SHAPES[shape];
  const ox = 2, oy = 2;
  const map = { O: outline, F: fill, S: shade, T: stem };
  for (let y = 0; y < rows.length; y++) {
    for (let x = 0; x < rows[y].length; x++) {
      const col = map[rows[y][x]];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(ox + x, oy + y, 1, 1);
    }
  }
}
function makeCanvas() {
  const c = document.createElement("canvas");
  c.width = 11; c.height = 11;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  return { c, g };
}
function buildSprites() {
  for (let s = 0; s < 3; s++) {
    const sil = makeCanvas();
    paintShape(sil.g, s, "#fff", "#fff", "#fff", "#fff");
    SPR.sil[s] = sil.c;
    for (let p = 0; p < 5; p++) {
      const im = makeCanvas();
      paintShape(im.g, s, PAL[p][0], PAL[p][1], PAL[p][2], PAL[p][3]);
      SPR.common[s * 5 + p] = im.c;

  if (!trySpend(HAND_PRICE[lvl])) return;
  handLevel = lvl;
}
function tryBuyTool(i) {
  if (ownedTool !== i - 1) return;
  if (!trySpend(TOOL_PRICE[i])) return;
  ownedTool = i;
  tool = i;
}
function tryBuyBag(tier) {
  if (bagTier !== tier - 1) return;
  if (!trySpend(BAGS[tier].price)) return;
  bagTier = tier;
  bagMax = BAGS[tier].cap;
}
function equip(i) {
  if (i > ownedTool) return;
  tool = i;
  dirty = true;
  sfxBlip();
}
function hardReset() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  money = 0; bag = [0, 0, 0, 0]; bagTier = 0; bagMax = 20;
  handLevel = 1; tool = 0; ownedTool = 0; total = 0; found = [0, 0, 0, 0];
  ach = { gold: false, rainbow: false, dark: false, hands: false, win: false };
  pending = 0; fallers = []; flyers = []; floats = []; achQueue = []; achCur = null;
  shopOpen = false; resetArm = false; hint = true;
  spawnInitial();
}
function save() {
  const data = {
    v: 1, money, bag, bagTier, bagMax, handLevel, tool, ownedTool, total, found, ach, muted, station, hint,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1) return;
    money = +d.money || 0;
    if (Array.isArray(d.bag) && d.bag.length === 4) bag = d.bag.map((n) => n | 0);
    bagTier = d.bagTier | 0;
    if (bagTier < 0 || bagTier >= BAGS.length) bagTier = 0;
    bagMax = BAGS[bagTier].cap;
    handLevel = Math.min(4, Math.max(1, d.handLevel | 0));
    ownedTool = Math.min(4, Math.max(0, d.ownedTool | 0));
    tool = Math.min(ownedTool, Math.max(0, d.tool | 0));
    total = Math.max(0, d.total | 0);
    if (Array.isArray(d.found) && d.found.length === 4) found = d.found.map((n) => n | 0);
    if (d.ach) ach = {
      gold: !!d.ach.gold, rainbow: !!d.ach.rainbow, dark: !!d.ach.dark,
      hands: !!d.ach.hands || total >= 1000, win: !!d.ach.win || total >= GOAL,
    };
    else if (total >= 1000) ach.hands = true;
    muted = !!d.muted;
    station = Math.min(2, Math.max(0, d.station | 0));
    hint = d.hint !== false && total === 0;
  } catch (e) {}
}

function panel(x, y, w, h) {
  ctx.fillStyle = "#1a120c";
  ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = "#8a5a32";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = "#6e4524";
  for (let i = 4; i < h; i += 6) ctx.fillRect(x, y + i, w, 1);
  ctx.fillStyle = "#c48a55";
  ctx.fillRect(x, y, w, 1);
  ctx.fillRect(x, y, 1, h);
  ctx.fillStyle = "#4a2c16";
  ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x + w - 1, y, 1, h);
}
function hitPush(x, y, w, h, id) { hits.push({ x, y, w, h, id }); }
function inside(h, x, y) { return x >= h.x && y >= h.y && x < h.x + h.w && y < h.y + h.h; }
function hitTest(x, y) {

  else if (st === "equip") text = label;
  const showPrice = st === "buy" || st === "lock";
  ctx.fillStyle = st === "using" ? "#6a8f45" : disabled ? "#5a4636" : "#c47a32";
  if (mouse.ok && inside({ x, y, w, h }, mouse.x, mouse.y) && !disabled && st !== "have" && st !== "using") ctx.fillStyle = "#e8a04a";
  ctx.fillRect(x, y, w, h);

  ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);

  if (showPrice) {

}

function blit(rows, ox, oy, map) {
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const col = map[row[x]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(ox + x, oy + y, 1, 1);
    }
  }
}
function drawCursor() {

      C: tan ? "#6e4e2c" : "#6b4630",

      M: gold ? "#ffe14a" : "#c9d0d4",

}

function updateShatter(dt) {
  shatterT += dt;
  if (!shattered && shatterT >= 0.55) {
    shattered = true;
    shake = 0.55;
    sfxGlass();
    shards = [];
    for (let i = 0; i < 48; i++) {
      const a = Math.random() * 6.283;
      const sp = 50 + Math.random() * 200;
      shards.push({
        x: VW / 2, y: VH / 2,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8,
        s: 4 + Math.random() * 12,
        tall: 0.4 + Math.random() * 0.5,
        c: ["#e7fbff", "#b9e4ef", "#ffffff", "#d5f0d0", "#d6ecff"][(Math.random() * 5) | 0],
      });
    }
  }
  if (shattered) {
    for (const s of shards) {
      s.vy += 280 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += s.vr * dt;
    }
  }
  if (shake > 0) shake -= dt;
  if (shatterT > 1.75) goSlide(1);
}
function drawShatter() {

    const u = Math.min(1, shatterT / 0.55);
    const y = -40 + u * u * (VH / 2 + 40);
    drawBigLeaf(VW / 2, y, 3, u * 2.6);
  } else {
    const a = Math.max(0, 1 - (shatterT - 0.55) / 0.18);
    if (a > 0) {
      ctx.fillStyle = "rgba(255,255,255," + a.toFixed(3) + ")";
      ctx.fillRect(0, 0, VW, VH);
    }
    for (const s of shards) {
      ctx.save();
      ctx.translate(s.x | 0, s.y | 0);
      ctx.rotate(s.rot);
      ctx.fillStyle = s.c;
      ctx.fillRect(-s.s / 2, -s.s * s.tall / 2, s.s, s.s * s.tall);
      ctx.strokeStyle = "#1a120c";
      ctx.strokeRect(-s.s / 2, -s.s * s.tall / 2, s.s, s.s * s.tall);
      ctx.restore();
    }
  }
}
function sceneBox() {
  const aspect = 480 / 270;

}
function R(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(C.x + Math.round(x * C.u), C.y + Math.round(y * C.v), Math.max(1, Math.round(w * C.u)), Math.max(1, Math.round(h * C.v)));
}
function Rc(cx, cy, r, col) {
  const rr = Math.max(1, Math.round(r * ((C.u + C.v) / 2)));
  const x = C.x + Math.round(cx * C.u);
  const y = C.y + Math.round(cy * C.v);
  ctx.fillStyle = col;
  const r2 = rr * rr;
  for (let iy = -rr; iy <= rr; iy++) {
    const w = Math.floor(Math.sqrt(Math.max(0, r2 - iy * iy)));
    ctx.fillRect(x - w, y + iy, w * 2 + 1, 1);
  }
}

    if (mode === "play") { shopOpen = !shopOpen; resetArm = false; }
  } else if (id === "shop-close") {
    shopOpen = false; resetArm = false;
  } else if (id === "shop-panel") {
    /* swallow */
  } else if (id === "mute") applyMute();
  else if (id === "radio") setStation(station + 1);
  else if (id.indexOf("buy-hand-") === 0) tryBuyHand(+id.slice(9));
  else if (id.indexOf("buy-tool-") === 0) tryBuyTool(+id.slice(9));
  else if (id.indexOf("equip-") === 0) equip(+id.slice(6));
  else if (id.indexOf("buy-bag-") === 0) tryBuyBag(+id.slice(8));
  else if (id === "reset") resetArm = true;
  else if (id === "reset-yes") hardReset();
}
function pointerDownAt(x, y) {
  mouse.x = x; mouse.y = y; mouse.ok = true;
  holding = true; fist = true; holdAcc = 0;
  const h = hitTest(x, y);
  if (mode === "shatter") {
    if (shatterT > 0.2) goSlide(1);
    suppressHold = true;
    return;
  }
  if (h) {
    suppressHold = true;
    activate(h.id);
    return;
  }
  if (mode === "cutscene") { nextSlide(); suppressHold = true; return; }
  if (mode === "play" && !shopOpen && x >= sell.x && y >= sell.y && x < sell.x + sell.w && y < sell.y + sell.h) {
    suppressHold = true;
    doSell();
    return;
  }
  suppressHold = false;
  if (mode === "play") tryCollect(true);
}
function onDown(e) {
  setMouse(e);
  pointerDownAt(mouse.x, mouse.y);
}
function onUp() {
  holding = false;
  suppressHold = false;
  fist = false;
}
function updateWind(dt) {
  if (holding && tool === 4 && mode === "play" && !shopOpen && !suppressHold) {
    for (let i = 0; i < 3; i++) {
      wind.push({
        x: mouse.x + (Math.random() - 0.5) * 70,
        y: mouse.y + (Math.random() - 0.5) * 40,
        a: 0.45,
      });
    }
  }
  for (let i = wind.length - 1; i >= 0; i--) {
    wind[i].a -= dt * 1.6;
    wind[i].x += 30 * dt;
    if (wind[i].a <= 0) wind.splice(i, 1);
  }
  if (wind.length > 40) wind.splice(0, wind.length - 40);
}

function update(dt) {
  time += dt;
  sndGap -= dt;
  if (pop > 0) pop -= dt;
  if (stationToast > 0) stationToast -= dt;
  if (shake > 0 && mode !== "shatter") shake -= dt;
  updateMenuLeaves(dt);
  if (mode === "shatter") updateShatter(dt);
  else if (mode === "cutscene") updateCut(dt);
  else if (mode === "play") {
    spawnPending();
    updateFallers(dt);
    updateFlyers(dt);
    updateHold(dt);
    updateHover();
    updateFloats(dt);
    updateAch(dt);
    updateWind(dt);
  }
  updateMusic();
  if (dirty) {
    saveAcc += dt;
    if (saveAcc > 0.7) { save(); saveAcc = 0; dirty = false; }
  }
}
function draw() {
  hits.length = 0;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#1a120c";
  ctx.fillRect(0, 0, VW, VH);
  if (mode === "cutscene") {
    drawCutscene();
    drawCursor();
    return;
  }
  drawPark();
  if (mode === "shatter") drawShatter();
  if (mode === "menu") drawMenu();
  if (mode === "play") {
    drawHUD();
    drawFloats();
    if (shopOpen) drawShop();
    drawAch();
  }
  drawCursor();
}
let last = 0;
function loop(now) {
  try {
    if (!last) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt);
    draw();
  } catch (e) {
    fail(e && e.message ? e.message : e);
    return;
  }
  requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown", (e) => {
  if (canvas.setPointerCapture) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
  onDown(e);
  e.preventDefault();
});
canvas.addEventListener("pointermove", (e) => { setMouse(e); });
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onUp);
canvas.addEventListener("pointerleave", () => { if (!holding) mouse.ok = false; });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("keydown", (e) => {
  if (e.key === "b" || e.key === "B") {
    if (mode === "play") { shopOpen = !shopOpen; resetArm = false; }
    e.preventDefault();
  } else if (e.key === "m" || e.key === "M") {
    unlock(); applyMute();
  } else if (e.key === "Escape" && shopOpen) shopOpen = false;
  else if (e.key === "Enter" || e.key === " ") {
    if (mode === "menu") begin();
    else if (mode === "shatter" && shatterT > 0.2) goSlide(1);
    else if (mode === "cutscene") nextSlide();
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && actx && actx.state === "suspended") actx.resume();
});
window.addEventListener("resize", () => resize(false));

window.__game = {
  ready: true,
  stats: function () {
    return {
      mode, total, money, leaves: leaves.length, fallers: fallers.length,
      bag: bagCount(), bagValue: round2(bagValue()), tool, handLevel, ownedTool,
      bagMax, bagTier, shopOpen, ach: Object.assign({}, ach), found: found.slice(),
      station, goal: GOAL, VW, VH, sell: Object.assign({}, sell), hudH,
    };
  },
  start: begin,
  skip: function () { startPlay(); },
  click: function (x, y) { pointerDownAt(x, y); },
  up: onUp,
  move: function (x, y) { mouse.x = x; mouse.y = y; mouse.ok = true; },
};

function boot() {
  try {
    initFont();
    buildSprites();
    resize(true);
    load();
    if (master && actx) master.gain.value = muted ? 0 : 1;
    spawnInitial();
    draw();
    requestAnimationFrame(loop);
  } catch (e) {
    fail(e && e.message ? e.message : e);
  }
}
boot();
</script>
</body>
</html>
